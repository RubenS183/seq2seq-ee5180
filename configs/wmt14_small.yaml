# Tier 1 -- WMT'14 En->Fr subset. THIS is the config behind the reported
# Table 1 rows 3-4. Test set is the paper's own ntst14 (newstest2014, full
# 3003-sentence version); dev is newstest2013.
name: wmt14_small
data_dir: $WORK/data/wmt14/prepared
run_dir: $WORK/runs/wmt14

# Model -- paper: 4 layers x 1000 cells, 1000-d emb, 384M params.
emb_dim: 512
hidden_dim: 512
num_layers: 2
dropout: 0.0
init_range: 0.08

lr: 0.7
batch_size: 128
grad_clip: 5.0
epochs: 8
lr_constant_epochs: 5.34   # 2/3 of training, as in the paper
lr_halve_every: 0.533      # 5 halvings, as in the paper

# Compute the loss in checkpointed chunks over time. The naive 32k softmax
# needs 836 MB for one logits tensor at batch 128 x 51 tokens; chunking keeps
# peak memory bounded. Maths is unchanged (tests assert loss+grad equality).
loss_chunk_size: 8

reverse_source: true
seed: 1
device: auto
log_every: 100
