# Tier 1, END-TERM -- WMT'14 En->Fr subset, prepared WITHOUT length-mismatch
# filtering. This is the config behind the bottleneck-vs-attention comparison.
#
# Two things differ from configs/wmt14_small.yaml, and nothing else:
#
#  1. data_dir points at `prepared_nofilter`, built with --max-ratio inf (no
#     length-mismatch pruning at all) and --max-len 100 instead of 50. The pair
#     count is still 500,000, so the corpus SIZE is held fixed and only its
#     length distribution changes. Mean target length rises 23.4 -> 26.2 tokens.
#  2. epochs/schedule are unchanged, so the two arms and the mid-term all share
#     the paper's optimiser recipe.
#
# BOTH end-term arms use THIS file. The arm is chosen on the command line
# (`--attention bahdanau`), which is what guarantees that attention is the only
# difference between them -- there is no second config to drift out of sync.
name: wmt14_endterm
data_dir: $WORK/data/wmt14/prepared_nofilter
run_dir: $WORK/runs/wmt14_endterm

# Model -- paper: 4 layers x 1000 cells, 1000-d emb, 384M params.
emb_dim: 512
hidden_dim: 512
num_layers: 2
dropout: 0.0
init_range: 0.08      # applied to the attention parameters too; measured to
                      # cost nothing against a scale-aware init, so no deviation

# End-term arm. Overridden per run by --attention; `none` reproduces the
# paper's architecture exactly.
attention: none
attn_dim: 512
encoder_bidirectional: false   # Bahdanau uses a BiRNN; holding the encoder
                               # unidirectional keeps attention the only variable

lr: 0.7
batch_size: 128
grad_clip: 5.0
epochs: 8
lr_constant_epochs: 5.34   # 2/3 of training, as in the paper
lr_halve_every: 0.533      # 5 halvings, as in the paper

loss_chunk_size: 8
empty_cache_every: 200

reverse_source: true
seed: 1
device: auto
log_every: 100
